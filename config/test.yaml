app:
  name: adapter
  debug: true


server:
  http:
    host:
    port: 7101
    ssl: false
  ext: >-
    {      
    } 

logger:
  default:
    level: "debug"
    format: "console"
    isSave: false
    disableCaller: true
    logFileConfig:
      filename: "./out.log"
      maxSize: 20
      maxBackups: 50
      maxAge: 15
      isCompression: true
  test:
    level: "debug"
    format: "json"
    isSave: false
    disableCaller: true
    logFileConfig:
      filename: "test.log"
      maxSize: 20
      maxBackups: 50
      maxAge: 15
      isCompression: true

