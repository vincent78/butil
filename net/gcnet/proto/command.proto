syntax = "proto3";


//option go_package = "path;name";
//path 表示生成的go文件的存放地址，会自动生成目录的。
//name 表示生成的go文件所属的包名。

option go_package = "../proto.pb;gcnet";


// The request message
message CmdRequest {
  string cmd = 1;
  string payload = 2;
}

// The response message
message CmdResponse {
  bool success = 1;
  string msg = 2;
  string payload = 3;
}
